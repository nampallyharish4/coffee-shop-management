version: '3.8'

services:
  # MySQL Database
  database:
    image: mysql:8.0
    container_name: coffee-shop-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-coffee_shop}
      MYSQL_USER: ${MYSQL_USER:-coffee_admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-Coffee@123}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./setup-mysql.sql:/docker-entrypoint-initdb.d/setup.sql
    networks:
      - coffee-shop-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coffee-shop-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://database:3306/${MYSQL_DATABASE:-coffee_shop}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-coffee_admin}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-Coffee@123}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      JWT_SECRET: ${JWT_SECRET:-5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - coffee-shop-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: coffee-shop-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - coffee-shop-network
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8081}

volumes:
  mysql_data:
    driver: local

networks:
  coffee-shop-network:
    driver: bridge
