databases:
  - name: coffee-shop-db
    databaseName: coffee_shop
    plan: free

services:
  - type: web
    name: coffee-shop-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: coffee-shop-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: coffee-shop-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: coffee-shop-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: coffee-shop-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: coffee-shop-db
          property: password
      - key: SPRING_DATASOURCE_DRIVER
        value: org.postgresql.Driver
      - key: SPRING_JPA_DIALECT
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: '86400000'
      - key: ALLOWED_ORIGINS
        value: 'https://your-app.vercel.app'
      - key: PORT
        value: '8081'
